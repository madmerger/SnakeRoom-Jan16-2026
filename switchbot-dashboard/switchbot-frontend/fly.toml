app = "snakeroom-frontend"
primary_region = "nrt"

[build]
  [build.args]
    VITE_API_URL = "https://snakeroom.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
